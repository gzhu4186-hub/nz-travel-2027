<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#536a50">
  <title>山湖之间 · 新西兰同行手册</title>
  <style>
    :root{--ink:#27352b;--green:#536a50;--pale:#eef3e9;--paper:#f6f8f3;--line:#e0e7db;--muted:#879482}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.75 -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}.shell{max-width:1050px;margin:auto;padding:28px 22px 48px}.hero{min-height:330px;padding:42px;position:relative;overflow:hidden;border-radius:18px;background:#385440 url('https://images.unsplash.com/photo-1469521669194-babb45599def?auto=format&fit=crop&w=1800&q=86') center/cover;color:#fff;box-shadow:0 12px 30px #38503a22}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#182b24ca,#19302645 72%),linear-gradient(0deg,#10261e66,transparent 58%)}.hero>*{position:relative}.hero small,.eyebrow{letter-spacing:2px;font-size:10px}.hero h1{font:700 42px/1.3 Georgia,"Noto Serif SC",serif;margin:14px 0 10px}.hero p{opacity:.92;margin:0}.hero-note{position:absolute;right:27px;bottom:23px;font-size:10px;letter-spacing:1px;color:#ffffffc9}.tabs{display:flex;gap:8px;margin:22px 0;overflow:auto}.tabs button,.date{border:1px solid var(--line);border-radius:8px;background:#fff;color:#64755f;padding:10px 15px;white-space:nowrap;cursor:pointer}.tabs button.active,.date.active,.filter.active{background:var(--green);border-color:var(--green);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:25px;margin-top:18px}.dates{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.date{display:grid;gap:2px;min-width:78px;text-align:center;padding:10px}.date b{font-family:Georgia;font-size:17px}.date small{font-size:10px}.cardhead{display:flex;justify-content:space-between;gap:15px;align-items:start}.cardhead h2{font:600 27px Georgia,"Noto Serif SC",serif;margin:7px 0}.day-photo{height:175px;margin:20px 0;border-radius:10px;background:center/cover no-repeat}.tag{font-size:11px;color:#69815e;background:var(--pale);padding:4px 8px;border-radius:5px;white-space:nowrap}.agenda{border-left:3px solid #9caf8e;background:#f7f9f5;padding:15px 18px;margin:22px 0;border-radius:0 8px 8px 0}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}.fact{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:14px 0;border-top:1px solid #edf0ea}.fact dt{color:var(--muted)}.fact dd{margin:0;white-space:pre-line}.related,.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.idea{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #edf0ea}.idea:first-of-type{border-top:0}.idea a{color:var(--ink);text-decoration:none}.idea small{display:block;color:var(--muted)}.state{border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:#f6f8f3;color:#74846b;font-size:11px;cursor:pointer;white-space:nowrap}.state[data-state="待预订"]{color:#a08048;background:#fbf4e5}.state[data-state="已预订"]{color:#5d8053;background:#edf5e9}.hint{font-size:11px;color:var(--muted);margin:12px 0 0}.progress{display:flex;align-items:center;gap:16px;background:var(--pale);border-radius:10px;padding:18px;margin-bottom:18px}.progress b{font:28px Georgia;color:var(--green)}.checkgroup h3{font-size:14px;margin:0 0 4px}.check{display:flex;gap:11px;padding:14px 0;border-top:1px solid #edf0ea;cursor:pointer}.check input{width:17px;height:17px;accent-color:var(--green);margin-top:4px}.check strong{display:block;font-weight:600}.check small{display:block;color:var(--muted);margin-top:3px}.check.done strong{text-decoration:line-through;color:#91a08b}.list-card{padding:17px 0;border-top:1px solid #edf0ea}.list-card:first-child{border-top:0}.list-card h3{margin:0 0 6px;font-size:15px}.list-card p{margin:0;color:#64755f;font-size:12px;white-space:pre-line}.photo-strip{display:grid;grid-template-columns:1.3fr .85fr .85fr;gap:10px;margin-top:18px;height:170px}.photo-strip div{border-radius:9px;background:center/cover no-repeat}.photo-strip div:first-child{background-image:url('https://images.unsplash.com/photo-1469521669194-babb45599def?auto=format&fit=crop&w=900&q=80')}.photo-strip div:nth-child(2){background-image:url('https://images.unsplash.com/photo-1507699622108-4be3abd695ad?auto=format&fit=crop&w=700&q=80')}.photo-strip div:nth-child(3){background-image:url('https://images.unsplash.com/photo-1483794344563-d27a8d38f7b5?auto=format&fit=crop&w=700&q=80')}.filters{display:grid;gap:9px;margin:18px 0}.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filter-label{width:62px;color:var(--muted);font-size:11px}.filter{border:1px solid var(--line);border-radius:6px;background:#fff;color:#64755f;padding:6px 10px;cursor:pointer;font-size:11px}.collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.place-card{border:1px solid var(--line);border-radius:10px;padding:18px;min-height:190px;display:flex;flex-direction:column}.place-card h3{font:600 18px Georgia,"Noto Serif SC",serif;margin:7px 0}.place-card p{color:#65725e;font-size:12px;margin:0 0 12px;white-space:pre-line}.place-actions{border-top:1px solid var(--line);padding-top:12px;margin-top:auto;display:flex;gap:15px;flex-wrap:wrap}.place-actions a{font-size:11px;color:#5b7654;text-decoration:none}.meta{color:var(--muted);font-size:11px}.footer{color:var(--muted);font-size:11px;text-align:center;margin-top:28px}.empty{color:var(--muted);font-size:12px}@media(max-width:620px){.shell{padding:15px}.hero{min-height:285px;padding:30px 24px}.hero h1{font-size:34px}.hero-note{right:20px;bottom:18px;font-size:8px}.panel{padding:18px}.facts,.related,.grid,.collection{grid-template-columns:1fr}.fact{grid-template-columns:70px 1fr}.cardhead h2{font-size:24px}.photo-strip{height:118px}.day-photo{height:135px}.filter-label{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><small>OUR NEW ZEALAND JOURNEY</small><h1>山湖之间</h1><p>2027.05.02 — 05.12 · 11 天秋日漫游</p><span class="hero-note">LAKE TEKAPO, NEW ZEALAND</span></header>
    <nav class="tabs"><button class="active" data-view="overview">旅行总览</button><button data-view="itinerary">每日行程</button><button data-view="stays">住宿与交通</button><button data-view="attractions">旅行灵感</button><button data-view="food">餐饮总表</button><button data-view="prepare">出发前准备</button></nav>
    <section id="overview"></section><section id="itinerary" hidden></section><section id="stays" hidden></section><section id="attractions" hidden></section><section id="food" hidden></section><section id="prepare" hidden></section>
    <p class="footer">行程来自旅游攻略.base。互动状态只保存在你当前使用的浏览器。</p>
  </main>
  <script>
  const cityName=s=>({wanaka:'瓦纳卡',tekapo:'蒂卡波'}[s]||s), $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const text=v=>Array.isArray(v)?v.map(x=>x.text||'').join(''):v||'';
  const keys=['景点','交通','住宿','餐食','穿搭建议']; const photos=['https://images.unsplash.com/photo-1469521669194-babb45599def?auto=format&fit=crop&w=1400&q=84','https://images.unsplash.com/photo-1507699622108-4be3abd695ad?auto=format&fit=crop&w=1400&q=84','https://images.unsplash.com/photo-1483794344563-d27a8d38f7b5?auto=format&fit=crop&w=1400&q=84']; let db,days,index=0;
  const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}}, save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  const prepKey='nz-2027-prep-v2', ideaKey='nz-2027-idea-bookings-v1'; let prep=load(prepKey), ideas=load(ideaKey);
  const maps=n=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n+' New Zealand');
  function ideaRows(type,ids){const rows=db[type].filter(r=>(ids||[]).includes(r.id));if(!rows.length)return '<p class="empty">当天没有关联收藏。</p>';return rows.slice(0,8).map(r=>{const name=text(r.景点名称||r.名称), state=ideas[r.id]||'未预订';return `<div class="idea"><a href="${maps(name)}" target="_blank" rel="noreferrer">${esc(name)}<small>${esc(text(r.类型||r.用餐类型||'旅行收藏'))}</small></a><button class="state" data-id="${r.id}" data-state="${state}">${state}</button></div>`}).join('')}
  function renderDay(){const d=days[index], date=d.日期?.slice(5).replace('-','.');const related=d.关联景点参考||[], food=d.关联美食参考||[];$('#itinerary').innerHTML=`<div class="panel"><div class="dates">${days.map((x,i)=>`<button class="date ${i===index?'active':''}" data-day="${i}"><small>DAY ${String(i+1).padStart(2,'0')}</small><b>${x.日期.slice(5).replace('-','.')}</b><small>${esc(cityName(x.城市))}</small></button>`).join('')}</div></div><article class="panel"><div class="cardhead"><div><span class="eyebrow">DAY ${String(index+1).padStart(2,'0')} / ${esc(cityName(d.城市))}</span><h2>${esc(d.行程概要||'当天行程')}</h2><p>${esc(d.日期||'')} · ${esc(cityName(d.城市))}</p></div><span class="tag">${esc(d.预订状态||'未标注')}</span></div><div class="day-photo" style="background-image:url('${photos[index%photos.length]}')"></div><div class="agenda"><b>今天的安排</b><div>${esc(d.行程概要||'未填写')}</div></div><dl class="facts">${keys.filter(k=>text(d[k])).map(k=>`<div class="fact"><dt>${k}</dt><dd>${esc(text(d[k]))}</dd></div>`).join('')}</dl>${d.需预订项目&&!['无','无需预订','无需预定'].includes(d.需预订项目)?`<div class="agenda"><b>需要留意的预订</b><div>${esc(d.需预订项目)}</div></div>`:''}</article><div class="related"><section class="panel"><h3>附近的旅行灵感</h3>${ideaRows('景点参考',related)}<p class="hint">点击状态可切换：未预订、待预订、已预订。</p></section><section class="panel"><h3>这一天，吃点好的</h3>${ideaRows('美食参考',food)}<p class="hint">点击状态可切换：未预订、待预订、已预订。</p></section></div>`;
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{index=+b.dataset.day;renderDay()});document.querySelectorAll('.state').forEach(b=>b.onclick=()=>{const states=['未预订','待预订','已预订'],id=b.dataset.id;ideas[id]=states[(states.indexOf(ideas[id]||'未预订')+1)%3];save(ideaKey,ideas);renderDay()})}
  function renderPrep(){const rows=db.出发前准备||[],done=rows.filter(r=>prep[r.id]).length;const groups=['证件','预约','物品','其他'];$('#prepare').innerHTML=`<div class="panel"><div class="progress"><b>${done}/20</b><span>已完成<br><small>所有事项默认未勾选，勾选会保存。</small></span></div>${groups.map(g=>`<div class="checkgroup"><h3>${g}</h3>${rows.filter(r=>r.类别===g).map(r=>`<label class="check ${prep[r.id]?'done':''}"><input type="checkbox" data-check="${r.id}" ${prep[r.id]?'checked':''}><span><strong>${esc(r.事项名称)}</strong><small>${esc(r.备注||'')}</small></span></label>`).join('')}</div>`).join('')}</div>`;document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{prep[b.dataset.check]=b.checked;save(prepKey,prep);renderPrep()})}
  function renderOverview(){$('#overview').innerHTML=`<div class="grid"><article class="panel"><span class="eyebrow">11 DAYS · 6 DESTINATIONS</span><h2>沿途，都是好风景</h2><div class="photo-strip"><div></div><div></div><div></div></div>${days.map((d,i)=>`<div class="list-card"><b>DAY ${String(i+1).padStart(2,'0')} · ${esc(cityName(d.城市))}</b><p>${esc(text(d.景点)||'行程待定')}</p><small class="meta">${esc(d.日期)} · ${esc(text(d.住宿)||'住宿待定')}</small></div>`).join('')}</article><article class="panel"><span class="eyebrow">TRIP STATUS</span><h2>旅行工作台</h2><p>每日行程保留景点、交通、住宿与预订状态；旅行灵感和餐饮总表可按城市查看。</p><div class="agenda"><b>提醒</b><div>清单和灵感预订状态只保存在当前浏览器。</div></div></article></div>`}
  function renderStays(){$('#stays').innerHTML=`<article class="panel"><span class="eyebrow">STAYS & TRANSPORT</span><h2>住宿与交通</h2>${days.map(d=>`<div class="list-card"><b>${esc(d.日期)} · ${esc(cityName(d.城市))}</b><p>交通：${esc(text(d.交通)||'未填写')}<br>住宿：${esc(text(d.住宿)||'未填写')}</p></div>`).join('')}</article>`}
  function renderTable(target,type,title){const rows=db[type]||[];if(type!=='景点参考'){$(target).innerHTML=`<article class="panel"><span class="eyebrow">FOOD & CAFÉS</span><h2>${title} <small class="meta">${rows.length} 个收藏</small></h2>${rows.map(r=>`<div class="list-card"><h3>${esc(text(r.名称))}</h3><p>${esc(text(r.简介||r.备注||''))}</p><small class="meta">${esc(cityName(text(r.所在城市)||'未填写城市'))} · ${esc(text(r.用餐类型||'旅行收藏'))}</small></div>`).join('')}</article>`;return}let city='全部',kind='全部';const cities=[...new Set(rows.map(r=>text(r.所在城市)).filter(Boolean))],kinds=[...new Set(rows.map(r=>text(r.类型)).filter(Boolean))];const draw=()=>{const shown=rows.filter(r=>(city==='全部'||text(r.所在城市)===city)&&(kind==='全部'||text(r.类型)===kind));$(target).innerHTML=`<article class="panel"><span class="eyebrow">PLACES & EXPERIENCES</span><h2>${title} <small class="meta">${shown.length} / ${rows.length} 个收藏</small></h2><div class="filters"><div class="filter-row"><span class="filter-label">目的地</span>${['全部',...cities].map(v=>`<button class="filter ${city===v?'active':''}" data-city="${esc(v)}">${esc(v==='全部'?v:cityName(v))}</button>`).join('')}</div><div class="filter-row"><span class="filter-label">活动类型</span>${['全部',...kinds].map(v=>`<button class="filter ${kind===v?'active':''}" data-kind="${esc(v)}">${esc(v)}</button>`).join('')}</div></div><div class="collection">${shown.length?shown.map((r,i)=>{const name=text(r.景点名称),official=text(r.预定官网地址);return `<article class="place-card"><small class="meta">${String(i+1).padStart(2,'0')} · ${esc(cityName(text(r.所在城市)))}</small><h3>${esc(name)}</h3><small class="meta">${esc(text(r.类型||'旅行收藏'))}${r.建议游玩时长?' · '+esc(r.建议游玩时长):''}</small><p>${esc(text(r.简介)||'暂无简介')}</p><div class="place-actions"><a href="${maps(name)}" target="_blank" rel="noreferrer">地图 ↗</a>${official?`<a href="${esc(official)}" target="_blank" rel="noreferrer">预订官网 ↗</a>`:''}</div></article>`}).join(''):'<p class="empty">没有符合条件的收藏。</p>'}</div></article>`;document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{city=b.dataset.city;draw()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;draw()})};draw()}
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['overview','itinerary','stays','attractions','food','prepare'].forEach(id=>$('#'+id).hidden=id!==view);if(view==='overview')renderOverview();if(view==='itinerary')renderDay();if(view==='stays')renderStays();if(view==='attractions')renderTable('#attractions','景点参考','旅行灵感');if(view==='food')renderTable('#food','美食参考','餐饮总表');if(view==='prepare')renderPrep()});
  fetch('./data.json').then(r=>r.json()).then(data=>{db=data;days=db['攻略最终版'];renderOverview();renderDay()}).catch(()=>{$('#overview').innerHTML='<div class="panel">行程数据加载失败，请稍后刷新。</div>'});
  </script>
</body>
</html>
